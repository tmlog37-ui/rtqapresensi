<!DOCTYPE html>
<html lang="id">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>RTQ Asy-Syafi'iyah - Presensi</title>

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f4f6f9;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            border: 0;
        }

    </style>

</head>

<body>

<iframe
    id="appFrame"
    src="https://script.google.com/macros/s/AKfycbw36plXk4bi0Pj8KdoAojaq7-W1aJLuof0zvEj3FkA3m9fuOeY7ZcyLyLNo9cB5VXVM/exec"
    allow="geolocation"
    allowfullscreen>
</iframe>


<script>

console.log("=================================");
console.log("GPS BRIDGE AKTIF");
console.log("=================================");


// ==========================================================
// IFRAME
// ==========================================================

const appFrame =
    document.getElementById("appFrame");


// ==========================================================
// TERIMA PESAN DARI INDEX.HTML
// ==========================================================

window.addEventListener("message", function(event) {

    console.log(
        "PESAN DITERIMA PARENT:",
        event.data
    );


    const data =
        event.data;


    if (!data) {
        return;
    }


    if (
        typeof data !== "object"
    ) {
        return;
    }


    if (
        data.type !==
        "REQUEST_GPS"
    ) {
        return;
    }


    console.log(
        "REQUEST GPS DITERIMA"
    );


    ambilGPS();

});


// ==========================================================
// AMBIL GPS
// ==========================================================

function ambilGPS() {

    console.log(
        "MULAI MENGAMBIL GPS..."
    );


    if (
        !navigator.geolocation
    ) {

        console.error(
            "Geolocation tidak tersedia"
        );


        kirimGPS({

            type:
                "GPS_RESULT",

            success:
                false,

            errorCode:
                0,

            message:
                "Browser tidak mendukung GPS."

        });

        return;
    }


    navigator.geolocation.getCurrentPosition(

        function(position) {

            console.log(
                "GPS BERHASIL"
            );


            const result = {

                type:
                    "GPS_RESULT",

                success:
                    true,

                latitude:
                    position.coords.latitude,

                longitude:
                    position.coords.longitude,

                accuracy:
                    position.coords.accuracy

            };


            console.log(
                "HASIL GPS:",
                result
            );


            kirimGPS(result);

        },


        function(error) {

            console.error(
                "GPS ERROR:",
                error
            );


            let message =
                "Gagal mendapatkan lokasi GPS.";


            if (
                error.code ===
                1
            ) {

                message =
                    "Izin lokasi ditolak. " +
                    "Silakan izinkan lokasi pada browser.";

            }


            else if (
                error.code ===
                2
            ) {

                message =
                    "Lokasi GPS tidak tersedia. " +
                    "Pastikan GPS HP aktif.";

            }


            else if (
                error.code ===
                3
            ) {

                message =
                    "GPS timeout. " +
                    "Silakan coba lagi.";

            }


            kirimGPS({

                type:
                    "GPS_RESULT",

                success:
                    false,

                errorCode:
                    error.code,

                message:
                    message

            });

        },


        {

            enableHighAccuracy:
                true,

            timeout:
                20000,

            maximumAge:
                0

        }

    );

}


// ==========================================================
// KIRIM HASIL GPS KE INDEX.HTML
// ==========================================================

function kirimGPS(data) {

    console.log(
        "KIRIM KE IFRAME:",
        data
    );


    if (
        appFrame.contentWindow
    ) {

        appFrame.contentWindow.postMessage(
            data,
            "*"
        );

    }

}


// ==========================================================
// CEK IFRAME SUDAH LOAD
// ==========================================================

appFrame.addEventListener(
    "load",
    function() {

        console.log(
            "IFRAME GAS BERHASIL LOAD"
        );

    }
);

</script>

</body>
</html>
