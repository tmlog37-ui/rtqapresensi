<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >
    <title>RTQ Asy-Syafi'iyah - Presensi</title>
    <style>
        * {
            box-sizing: border-box;
        }
        html,
        body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f4f6f9;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            min-height: 100vh;
            border: none;
        }
    </style>
</head>
<body>
    <iframe
        id="appFrame"
        src="https://script.google.com/macros/s/AKfycbw36plXk4bi0Pj8KdoAojaq7-W1aJLuof0zvEj3FkA3m9fuOeY7ZcyLyLNo9cB5VXVM/exec"
        allow="geolocation *"
        allowfullscreen>
    </iframe>
<script>
    // =========================================================
    // REFERENSI IFRAME GAS
    // =========================================================
    const appFrame =
        document.getElementById("appFrame");

    // =========================================================
    // MENERIMA PERMINTAAN GPS DARI INDEX.HTML
    // =========================================================
    window.addEventListener("message", function(event) {
        // Pastikan pesan berasal dari iframe kita
        if (event.source !== appFrame.contentWindow) {
            return;
        }
        const data = event.data;
        if (!data || typeof data !== "object") {
            return;
        }
        // Hanya proses request GPS
        if (data.type !== "REQUEST_GPS") {
            return;
        }
        ambilGPS();
    });

    // =========================================================
    // FUNGSI AMBIL GPS
    // GPS DIJALANKAN DI PARENT, BUKAN DI IFRAME
    // =========================================================
    function ambilGPS() {
        if (!navigator.geolocation) {
            kirimKeIframe({
                type: "GPS_RESULT",
                success: false,
                errorCode: 0,
                message:
                    "Perangkat/browser tidak mendukung GPS."
            });
            return;
        }

        navigator.geolocation.getCurrentPosition(
            function(position) {
                const result = {
                    type: "GPS_RESULT",
                    success: true,
                    latitude:
                        position.coords.latitude,

                    longitude:
                        position.coords.longitude,

                    accuracy:
                        position.coords.accuracy

                };

                console.log(
                    "GPS BERHASIL:",
                    result
                );

                kirimKeIframe(result);
            },

            function(error) {

                console.error(
                    "GPS ERROR:",
                    error
                );

                let message =
                    "Gagal mengambil lokasi GPS.";

                if (
                    error.code ===
                    error.PERMISSION_DENIED
                ) {

                    message =
                        "Izin lokasi ditolak. " +
                        "Silakan izinkan akses lokasi untuk browser ini.";

                }

                else if (
                    error.code ===
                    error.POSITION_UNAVAILABLE
                ) {

                    message =
                        "Lokasi GPS tidak tersedia. " +
                        "Pastikan GPS/Lokasi HP aktif.";
                }

                else if (
                    error.code ===
                    error.TIMEOUT
                ) {
                    message =
                        "GPS terlalu lama mendapatkan lokasi. " +
                        "Silakan coba lagi.";
                }

                kirimKeIframe({
                    type: "GPS_RESULT",
                    success: false,
                    errorCode:
                        error.code,
                    message:
                        message
                });
            },

            {
                enableHighAccuracy: true,
                timeout: 20000,
                maximumAge: 0
            }
        );
    }

    // =========================================================
    // KIRIM HASIL GPS KE IFRAME GAS
    // =========================================================
    function kirimKeIframe(data) {
        appFrame.contentWindow.postMessage(
            data,
            "*"
        );
    }
</script>

</body>
</html>
